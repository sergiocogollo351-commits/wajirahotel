{% extends 'base.html' %}

{% block content %}
<div class="container my-3 my-md-4" data-aos="fade-up">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-body p-3 p-sm-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white p-3 rounded-circle d-inline-flex mb-2 shadow-sm">
                            <i class="bi bi-door-open-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Registrar Nueva Habitación</h3>
                        <p class="text-muted small">Ingresa las especificaciones, tarifa por noche y fotografía de la habitación</p>
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Número / Código de Habitación</label>
                                <input type="text" name="numero" class="form-control" placeholder="Ej. 101, 202, 301" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Tipo de Habitación</label>
                                <select name="tipo" class="form-select" required>
                                    <option value="">-- Seleccionar Tipo --</option>
                                    {% for t in tipos %}
                                        <option value="{{ t.id }}">{{ t.nombre }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-sm-4">
                                <label class="form-label small fw-bold">Piso / Ubicación</label>
                                <input type="number" name="piso" class="form-control" value="1" min="1" max="20" required>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label class="form-label small fw-bold">Capacidad (Personas)</label>
                                <input type="number" name="capacidad" class="form-control" value="2" min="1" max="10" required>
                            </div>
                            <div class="col-12 col-sm-4">
                                <label class="form-label small fw-bold">Precio por Noche ($)</label>
                                <input type="number" step="0.01" name="precio" class="form-control" placeholder="Ej. 150000" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Fotografía de la Habitación</label>
                            <input type="file" name="imagen" class="form-control" accept="image/*">
                            <small class="text-muted">Formato recomendado: JPG o PNG</small>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 pt-2 border-top">
                            <a href="{% url 'lista_habitaciones' %}" class="btn btn-secondary order-2 order-sm-1">
                                <i class="bi bi-x-circle me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold order-1 order-sm-2">
                                <i class="bi bi-cloud-upload me-1"></i> Guardar Habitación
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
