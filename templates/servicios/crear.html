{% extends 'base.html' %}

{% block content %}
<div class="container my-3 my-md-4" data-aos="fade-up">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-body p-3 p-sm-4 p-md-5">
                    
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white p-3 rounded-circle d-inline-flex mb-2 shadow-sm">
                            <i class="bi bi-cart-plus-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Registrar Nuevo Servicio / Producto</h3>
                        <p class="text-muted small">Crea ítems consumibles o servicios guiados con su respectiva fotografía y categoría</p>
                    </div>

                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}

                        <div class="row g-3 mb-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Nombre del Servicio / Producto</label>
                                <input type="text" name="nombre" class="form-control" placeholder="Ej. Club Sandwich, Cerveza Club Colombia, Tour Cabo" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label small fw-bold">Categoría</label>
                                <select name="categoria" class="form-select" required>
                                    {% for cod, nombre_cat in categorias %}
                                        <option value="{{ cod }}">{{ nombre_cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Tarifa / Precio unitario ($)</label>
                            <input type="number" step="0.01" name="precio" class="form-control" placeholder="Ej. 25000" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Fotografía del Producto o Servicio</label>
                            <input type="file" name="imagen" class="form-control" accept="image/*">
                            <small class="text-muted">Formato recomendado: JPG o PNG</small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Descripción Corta</label>
                            <textarea name="descripcion" class="form-control" rows="3" placeholder="Detalla qué incluye el servicio o las condiciones del consumo..."></textarea>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 pt-2 border-top">
                            <a href="{% url 'lista_servicios' %}" class="btn btn-secondary order-2 order-sm-1">
                                <i class="bi bi-x-circle me-1"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold order-1 order-sm-2">
                                <i class="bi bi-cloud-upload me-1"></i> Guardar Servicio
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
