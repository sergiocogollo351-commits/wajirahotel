{% extends 'base.html' %}

{% block content %}
<div class="container my-3 my-md-4" data-aos="fade-up">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                <div class="card-body p-3 p-sm-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white p-3 rounded-circle d-inline-flex mb-2 shadow-sm">
                            <i class="bi bi-cup-straw fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Cargar Servicio Extra</h3>
                        <p class="text-muted small">Reserva #{{ reserva.id }} · Habitación {{ reserva.habitacion.numero }}</p>
                    </div>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Servicio Adicional</label>
                            <select name="servicio" class="form-select" required>
                                <option value="">-- Seleccionar Servicio --</option>
                                {% for s in servicios %}
                                    <option value="{{ s.id }}">{{ s.nombre }} (${{ s.precio|floatformat:0 }})</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Cantidad</label>
                            <input type="number" min="1" max="20" name="cantidad" class="form-control" value="1" required>
                        </div>

                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 pt-2 border-top">
                            <a href="{% url 'lista_reservas' %}" class="btn btn-secondary order-2 order-sm-1">
                                <i class="bi bi-arrow-left me-1"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-primary fw-bold order-1 order-sm-2">
                                <i class="bi bi-plus-circle me-1"></i> Cargar a la Cuenta
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
